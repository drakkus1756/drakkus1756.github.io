<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starforce Simulator for RoyalStory</title>

    <script src="bootstrap.js"></script>
    <script src="script.js"></script>

    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container margin-bottom-footer">
        <div class="maincon">
            <h2 class="calculator-title">Starforce Simulator for RoyalStory</h2>
            
            <form onsubmit="return false" class="calc-form">
                <!-- Group 1: Configuration -->
                <div class="form-grid">
                    <div class="form-group">
                        <label for="req_level">Item Level</label>
                        <input id="req_level" name="req_level" type="number" value="150">
                    </div>
                    <div class="form-group">
                        <label for="auto_starforce">Auto Starforce</label>
                        <select id="auto_starforce" name="auto_starforce">
                            <option>Manual</option>
                            <option>Automatic</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="nx_cost">NX per attempt</label>
                        <select id="nx_cost" name="nx_cost">
                            <option>Calculate All</option>
                            <option>15,000</option>
                            <option>300,000</option>
                            <option>750,000</option>
                            <option>3,000,000</option>
                        </select>
                    </div>
                </div>

                <!-- Group 2: Stars -->
                <div class="form-grid">
                    <div class="form-group">
                        <label for="current_stars">Current Stars</label>
                        <input type="number" id="current_stars" name="current_stars" min=0 max=24 value="0">
                    </div>
                    <div class="form-group">
                        <label for="target_stars">Target Stars</label>
                        <input type="number" id="target_stars" name="target_stars" min= 1 max=25 value="25">
                    </div>
                </div>

                <!-- Group 3: Trials -->
                <div class="form-grid split-two">
                    <div class="form-group">
                        <label for="num_trials">Number of trials</label>
                        <input type="number" id="num_trials" name="num_trials" value="1000">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="button-container">
                    <button id="calculate_button" type="submit" class="btn btnSubmit">Simulate</button>
                </div>
            </form>

            <!-- Results Output Window -->
            <div class="results-container">
                <h3>Results</h3>
                <!-- The <pre> tag guarantees your JavaScript padding strings line up perfectly -->
                <pre id="output-window">Waiting for simulation...</pre>
            </div>
        </div>
    </div>
    <footer class="ai-footer">
        <p>This page's design and layout was created with the assistance of AI.</p>
    </footer>
</body>
</html>
